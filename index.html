<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dhananjay Singh</title>
<style>
  :root{
    --bg:#0f172a; --card:#ffffff; --ink:#1e293b; --muted:#64748b;
    --accent:#1d4ed8; --accent-light:#dbeafe; --border:#e2e8f0;
  }
  *{box-sizing:border-box;}
  html,body{margin:0; height:100%;}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    background:radial-gradient(circle at 20% 20%, #1e3a8a 0%, #0f172a 45%, #0b1120 100%);
    min-height:100vh; color:#fff;
    display:flex; align-items:center; justify-content:center;
    padding:24px;
    position:relative;
    overflow-x:hidden;
  }
  .blob{
    position:absolute; border-radius:50%; filter:blur(60px); opacity:0.35; z-index:0;
  }
  .blob1{width:320px; height:320px; background:#3b82f6; top:-80px; left:-80px;}
  .blob2{width:280px; height:280px; background:#6366f1; bottom:-60px; right:-60px;}

  .card{
    position:relative; z-index:1;
    background:rgba(255,255,255,0.05);
    border:1px solid rgba(255,255,255,0.12);
    backdrop-filter:blur(14px);
    border-radius:28px;
    padding:44px 36px 40px;
    max-width:440px;
    width:100%;
    text-align:center;
    box-shadow:0 30px 60px rgba(0,0,0,0.4);
  }
  .avatar-wrap{
    width:150px; height:150px; margin:0 auto 22px; border-radius:50%;
    padding:4px;
    background:linear-gradient(135deg, #3b82f6, #a855f7);
  }
  .avatar-wrap img{
    width:100%; height:100%; border-radius:50%; object-fit:cover; display:block;
    border:3px solid #0f172a;
  }
  h1{
    font-size:1.7rem; font-weight:800; margin:0 0 6px; letter-spacing:-0.02em;
  }
  .tagline{
    font-size:0.92rem; color:#cbd5e1; margin:0 0 26px; line-height:1.5;
  }
  .cta{
    display:inline-flex; align-items:center; gap:8px;
    background:linear-gradient(135deg, #2563eb, #4f46e5);
    color:#fff; text-decoration:none; font-weight:700; font-size:0.98rem;
    padding:14px 26px; border-radius:14px; margin-bottom:28px;
    box-shadow:0 10px 25px rgba(37,99,235,0.4);
    transition:transform .15s, box-shadow .15s;
  }
  .cta:hover{transform:translateY(-2px); box-shadow:0 14px 30px rgba(37,99,235,0.5);}
  .cta .arrow{transition:transform .15s;}
  .cta:hover .arrow{transform:translateX(3px);}

  .social-row{
    display:flex; justify-content:center; gap:14px; flex-wrap:wrap;
    padding-top:22px; border-top:1px solid rgba(255,255,255,0.12);
  }
  .social-btn{
    width:44px; height:44px; border-radius:50%;
    background:rgba(255,255,255,0.08);
    border:1px solid rgba(255,255,255,0.15);
    display:flex; align-items:center; justify-content:center;
    color:#fff; text-decoration:none;
    transition:.18s;
  }
  .social-btn svg{width:20px; height:20px;}
  .social-btn:hover{background:#fff; color:#0f172a; transform:translateY(-3px);}
  .social-btn.github:hover{background:#181717; color:#fff;}
  .social-btn.linkedin:hover{background:#0a66c2; color:#fff;}
  .social-btn.instagram:hover{background:radial-gradient(circle at 30% 107%, #fdf497 0%, #fdf497 5%, #fd5949 45%, #d6249f 60%, #285AEB 90%); color:#fff;}
  .social-btn.facebook:hover{background:#1877f2; color:#fff;}

  .footer-note{margin-top:26px; font-size:0.72rem; color:#64748b;}

  @media (max-width:420px){
    .card{padding:34px 22px 30px; border-radius:22px;}
    .avatar-wrap{width:120px; height:120px;}
    h1{font-size:1.4rem;}
  }
</style>
</head>
